# Canonical SOP-checklist peer-ack gate for consumer repositories.
#
# INSTALL AS: .gitea/workflows/sop-checklist-gate.yml
# AND DELETE: .gitea/scripts/sop-checklist-gate.py  (the vendored copy)
# KEEP:       .gitea/sop-checklist-config.yaml      (per-repo item/team map)
#
# This template replaces the three hand-maintained copies of the gate script
# that had drifted in both directions (molecule-app had the Cloudflare-UA fix
# and the operator relax; molecule-ai-status had the #369 OOM guardrail, the
# trusted-acker probe and the 403-tolerant status POST; molecules-market had
# neither). The union now lives once, in molecule-ci/scripts/
# sop_checklist_gate.py, and is fetched here at a reviewed immutable pin.
#
# Cross-repository `workflow_call` is deliberately not used on Gitea 1.26.4: a
# caller can be recorded green with ZERO referenced steps executed, which is a
# phantom gate. Hence the inline fetch + SHA verification + execution sentinel,
# matching templates/ci-minimal.yml and templates/ci-secret-scan.yml.
#
# TRUST BOUNDARY (RFC#324 §A4): `pull_request_target`, and the checkout pins
# `ref: default_branch`, so both this workflow definition AND the config it
# reads come from the trusted base — never from PR head. The gate script comes
# from a verified molecule-ci commit, which is stricter still: PR head cannot
# influence it even in the repo that owns the config.

name: sop-checklist-gate

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  # `edited` and `deleted` are kept (molecule-app had narrowed to `created`
  # for runner-capacity reasons). The capacity problem is solved properly by
  # the concurrency group below rather than by dropping the refire channel a
  # reviewer uses when they edit a comment to add /sop-ack.
  issue_comment:
    types: [created, edited, deleted]

# Serialize per PR. Prevents the OOM-storm fan-out documented in
# `reference_operator_host_python3_oom_storm_2026_05_18`: a merge fan-fired 7
# concurrent runs (one per comment event) and OOM-killed 4 of them.
#
# NO `cancel-in-progress`. Cancelling in-flight required-check runs triggers
# `dismiss_stale_approvals` and the empty-commit-rerun dance. The gate is
# read-only and idempotent, so queued ticks may simply run sequentially.
concurrency:
  group: sop-checklist-gate-${{ github.event.issue.number || github.event.pull_request.number }}

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  gate:
    name: gate
    if: |
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       (contains(github.event.comment.body, '/sop-ack') ||
        contains(github.event.comment.body, '/sop-revoke')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MOLECULE_CI_REF: 38121bd4c7c0f3fe059c624274867d1da1fbe260
    steps:
      - name: Check out BASE ref (trust boundary — never PR-head)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11.15"

      - name: Fetch immutable molecule-ci gate SSOT
        run: |
          set -euo pipefail
          test -n "${RUNNER_TEMP:-}"
          CI_ROOT="$RUNNER_TEMP/molecule-ci-ssot"
          GIT_HOME="$RUNNER_TEMP/molecule-ci-git-home"
          mkdir "$CI_ROOT" "$GIT_HOME"
          chmod 700 "$CI_ROOT" "$GIT_HOME"
          safe_git() {
            env -i \
              PATH="$PATH" \
              HOME="$GIT_HOME" \
              GIT_CONFIG_GLOBAL=/dev/null \
              GIT_CONFIG_NOSYSTEM=1 \
              GIT_TERMINAL_PROMPT=0 \
              GIT_ASKPASS=/bin/false \
              GIT_ALLOW_PROTOCOL=https \
              git -c http.userAgent=curl/8.4.0 "$@"
          }
          safe_git init -q "$CI_ROOT"
          safe_git -C "$CI_ROOT" remote add origin \
            https://git.moleculesai.app/molecule-ai/molecule-ci.git
          safe_git -C "$CI_ROOT" fetch -q --depth 1 origin "$MOLECULE_CI_REF"
          safe_git -C "$CI_ROOT" checkout -q --detach FETCH_HEAD
          test "$(safe_git -C "$CI_ROOT" rev-parse HEAD)" = "$MOLECULE_CI_REF"

      - name: Install exact hash-locked gate dependency
        run: |
          set -euo pipefail
          test -n "${RUNNER_TEMP:-}"
          lock="$RUNNER_TEMP/molecule-ci-sop.lock"
          printf '%s\n' \
            'PyYAML==6.0.3 --hash=sha256:b8bb0864c5a28024fac8a632c443c87c5aa6f215c0b126c449ae1a150412f31d' \
            > "$lock"
          TOOL_CACHE_ROOT=$(
            CDPATH='' cd -P -- \
              "${RUNNER_TOOL_CACHE:?runner did not export RUNNER_TOOL_CACHE}" \
              && pwd -P
          )
          PYTHON_ROOT=$(
            CDPATH='' cd -P -- \
              "${pythonLocation:?setup-python did not export pythonLocation}" \
              && pwd -P
          )
          case "$PYTHON_ROOT" in
            "$TOOL_CACHE_ROOT"/Python/3.11.15/*) ;;
            *)
              echo "setup-python returned an unexpected runtime path" >&2
              exit 1
              ;;
          esac
          PYTHON_BIN="$PYTHON_ROOT/bin/python3"
          PYTHON_LIB="$PYTHON_ROOT/lib"
          test -x "$PYTHON_BIN"
          test -d "$PYTHON_LIB"
          env -i \
            PATH="$PYTHON_ROOT/bin:/usr/bin:/bin" \
            LD_LIBRARY_PATH="$PYTHON_LIB" \
            HOME="$RUNNER_TEMP" \
            PIP_CONFIG_FILE=/dev/null \
            PIP_INDEX_URL=https://pypi.org/simple/ \
            PIP_NO_INPUT=1 \
            PYTHONNOUSERSITE=1 \
            "$PYTHON_BIN" -m pip install \
              --disable-pip-version-check \
              --break-system-packages \
              --no-deps \
              --only-binary=:all: \
              --require-hashes \
              -r "$lock"

      - name: Run sop-checklist-gate
        env:
          # Infisical is authoritative whenever its CI identity is configured.
          # The correctly scoped org Actions secret is the only fallback for
          # consumers without that identity. Known wrong-scope historical
          # tokens are deliberately not accepted.
          INFISICAL_CI_CLIENT_ID: ${{ secrets.INFISICAL_CI_CLIENT_ID }}
          INFISICAL_CI_CLIENT_SECRET: ${{ secrets.INFISICAL_CI_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_CI_PROJECT_ID }}
          SOP_CHECKLIST_GATE_TOKEN: ${{ secrets.SOP_CHECKLIST_GATE_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          # Org Actions variable. While != 'true' the gate evaluates every ack
          # in full but posts SUCCESS with the real tally appended. Set it to
          # 'true' to restore hard enforcement with zero code change.
          MERGE_REQUIRE_SOP_ACK: ${{ vars.MERGE_REQUIRE_SOP_ACK }}
          # Org Actions variable. Origin the gate CALLS for the REST API.
          # Separate from the public host used for the status link, so the API
          # can move off the Cloudflare edge without breaking that link.
          MOLECULE_GITEA_API_HOST: ${{ vars.MOLECULE_GITEA_API_HOST }}
        run: |
          set -euo pipefail
          BASE="https://key.moleculesai.app"

          if [ -n "${INFISICAL_CI_CLIENT_ID:-}" ]; then
            : "${INFISICAL_CI_CLIENT_SECRET:?missing Infisical CI client secret}"
            : "${INFISICAL_PROJECT_ID:?missing Infisical project ID}"
            infisical_client_id="$INFISICAL_CI_CLIENT_ID"
            infisical_client_secret="$INFISICAL_CI_CLIENT_SECRET"
            infisical_project_id="$INFISICAL_PROJECT_ID"
            unset INFISICAL_CI_CLIENT_ID INFISICAL_CI_CLIENT_SECRET
            unset INFISICAL_PROJECT_ID SOP_CHECKLIST_GATE_TOKEN

            TOK=$(
              CLIENT_ID="$infisical_client_id" \
                CLIENT_SECRET="$infisical_client_secret" \
                python3 -I -c 'import json,os,sys; json.dump({"clientId":os.environ["CLIENT_ID"],"clientSecret":os.environ["CLIENT_SECRET"]},sys.stdout)' \
                | curl -fsS --retry 3 --retry-all-errors --retry-max-time 60 \
                    --connect-timeout 10 --max-time 60 --max-filesize 1048576 \
                    --proto '=https' --tlsv1.2 -A curl/8.4.0 \
                    -X POST "$BASE/api/v1/auth/universal-auth/login" \
                    -H 'Content-Type: application/json' --data-binary @- \
                | python3 -I -c 'import sys,json;d=json.load(sys.stdin);v=d.get("accessToken");sys.stdout.write(v if isinstance(v,str) else "")'
            )
            unset infisical_client_id infisical_client_secret
            if [ -z "$TOK" ]; then
              echo "Infisical universal-auth returned no access token" >&2
              exit 1
            fi
            case "$TOK" in
              *$'\r'*|*$'\n'*)
                echo "Infisical access token contains a forbidden line break" >&2
                exit 1
                ;;
            esac

            resolved_token=$(
              printf 'Authorization: Bearer %s\n' "$TOK" \
                | curl -fsS --retry 3 --retry-all-errors --retry-max-time 60 \
                    --connect-timeout 10 --max-time 60 --max-filesize 1048576 \
                    --proto '=https' --tlsv1.2 -A curl/8.4.0 \
                    "$BASE/api/v3/secrets/raw/SOP_CHECKLIST_GATE_TOKEN?workspaceId=$infisical_project_id&environment=prod&secretPath=%2Fshared%2Fgitea-bot-tokens" \
                    -H @- \
                | python3 -I -c 'import sys,json;d=json.load(sys.stdin);v=(d.get("secret") or {}).get("secretValue");sys.stdout.write(v if isinstance(v,str) else "")'
            )
            unset TOK infisical_project_id
            if [ -z "$resolved_token" ]; then
              echo "Infisical returned no SOP_CHECKLIST_GATE_TOKEN" >&2
              exit 1
            fi
          else
            resolved_token="${SOP_CHECKLIST_GATE_TOKEN:-}"
            unset INFISICAL_CI_CLIENT_ID INFISICAL_CI_CLIENT_SECRET
            unset INFISICAL_PROJECT_ID SOP_CHECKLIST_GATE_TOKEN
          fi

          if [ -z "$resolved_token" ]; then
            echo "no correctly scoped SOP checklist gate token is configured" >&2
            exit 1
          fi
          case "$resolved_token" in
            *$'\r'*|*$'\n'*)
              echo "resolved gate token contains a forbidden line break" >&2
              exit 1
              ;;
          esac

          GITEA_TOKEN="$resolved_token" \
            python3 -I "$RUNNER_TEMP/molecule-ci-ssot/scripts/sop_checklist_gate.py" \
            --owner "$OWNER" \
            --repo "$REPO_NAME" \
            --pr "$PR_NUMBER" \
            --config .gitea/sop-checklist-config.yaml \
            --gitea-host git.moleculesai.app \
            | tee /tmp/sop-checklist-gate.log
          unset resolved_token

      - name: Assert execution sentinel
        run: grep -qxF 'sop-checklist:sentinel:executed' /tmp/sop-checklist-gate.log

      # The gate picks a CHECKLIST TIER from the paths the diff touches, and a
      # silent downgrade is how a gate gets quietly hollowed out. So the tier
      # disclosure is a hard assertion, not a nicety: a run that decided a tier
      # without printing which one and why does not pass this step. The line
      # also lands in the job log verbatim, so a reviewer can read the reason
      # (`reserved path …`, `all N changed file(s) trivial-only`, `fail-closed:
      # …`) without re-deriving it.
      - name: Assert checklist-tier disclosure
        run: |
          grep -E '^sop-checklist:tier:(full|light):.+' /tmp/sop-checklist-gate.log
