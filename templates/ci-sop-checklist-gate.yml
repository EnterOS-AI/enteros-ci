# Canonical SOP-checklist peer-ack gate for consumer repositories.
#
# INSTALL AS: .gitea/workflows/sop-checklist-gate.yml
# AND DELETE: .gitea/scripts/sop-checklist-gate.py  (the vendored copy)
# KEEP:       .gitea/sop-checklist-config.yaml      (per-repo item/team map)
#
# This template replaces the three hand-maintained copies of the gate script
# that had drifted in both directions (molecule-app had the Cloudflare-UA fix
# and the operator relax; molecule-ai-status had the #369 OOM guardrail, the
# trusted-acker probe and the 403-tolerant status POST; molecules-market had
# neither). The union now lives once, in molecule-ci/scripts/
# sop_checklist_gate.py, and is fetched here at a reviewed immutable pin.
#
# Cross-repository `workflow_call` is deliberately not used on Gitea 1.26.4: a
# caller can be recorded green with ZERO referenced steps executed, which is a
# phantom gate. Hence the inline fetch + SHA verification + execution sentinel,
# matching templates/ci-minimal.yml and templates/ci-secret-scan.yml.
#
# TRUST BOUNDARY (RFC#324 §A4): `pull_request_target`, and the checkout pins
# `ref: default_branch`, so both this workflow definition AND the config it
# reads come from the trusted base — never from PR head. The gate script comes
# from a verified molecule-ci commit, which is stricter still: PR head cannot
# influence it even in the repo that owns the config.

name: sop-checklist-gate

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  # `edited` and `deleted` are kept (molecule-app had narrowed to `created`
  # for runner-capacity reasons). The capacity problem is solved properly by
  # the concurrency group below rather than by dropping the refire channel a
  # reviewer uses when they edit a comment to add /sop-ack.
  issue_comment:
    types: [created, edited, deleted]

# Serialize per PR. Prevents the OOM-storm fan-out documented in
# `reference_operator_host_python3_oom_storm_2026_05_18`: a merge fan-fired 7
# concurrent runs (one per comment event) and OOM-killed 4 of them.
#
# NO `cancel-in-progress`. Cancelling in-flight required-check runs triggers
# `dismiss_stale_approvals` and the empty-commit-rerun dance. The gate is
# read-only and idempotent, so queued ticks may simply run sequentially.
concurrency:
  group: sop-checklist-gate-${{ github.event.issue.number || github.event.pull_request.number }}

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  gate:
    name: gate
    if: |
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       (contains(github.event.comment.body, '/sop-ack') ||
        contains(github.event.comment.body, '/sop-revoke')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MOLECULE_CI_REF: 45fbe831b983a4bb48bdeb19499e9eb5e8fef3dd
    steps:
      - name: Check out BASE ref (trust boundary — never PR-head)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Fetch immutable molecule-ci gate SSOT
        run: |
          test -n "${RUNNER_TEMP:-}"
          CI_ROOT="$RUNNER_TEMP/molecule-ci-ssot"
          mkdir "$CI_ROOT"
          git init -q "$CI_ROOT"
          git -C "$CI_ROOT" remote add origin \
            https://git.moleculesai.app/molecule-ai/molecule-ci.git
          git -C "$CI_ROOT" fetch -q --depth 1 origin "$MOLECULE_CI_REF"
          git -C "$CI_ROOT" checkout -q --detach FETCH_HEAD
          test "$(git -C "$CI_ROOT" rev-parse HEAD)" = "$MOLECULE_CI_REF"

      - run: pip install --break-system-packages pyyaml -q

      # OPTIONAL: source the gate token from the Infisical SSOT instead of a
      # duplicated Gitea Actions secret (KMS wave-2). Skipped entirely when the
      # consumer has no Infisical CI identity, so this template does not force
      # Infisical credentials on every repo. When Infisical IS configured it is
      # AUTHORITATIVE for this token, so a broken/empty fetch hard-fails here
      # rather than being silently absorbed by the fallback chain below.
      #
      # WHICH SECRET (2026-07-25 fix): this step used to fetch
      # SOP_TIER_CHECK_TOKEN, which is the sop-TIER-check gate's token and
      # carries `write:issue` for labelling — NOT `write:repository`. So the
      # checklist gate's own `POST /repos/{R}/statuses/{sha}` came back
      #   403 required=[write:repository]
      # the script raised, and the REQUIRED context went red on every PR in
      # repos that had no better token in the chain (molecules-market has zero
      # repo-level Actions secrets, so it fell all the way through to the run's
      # auto token). SOP_CHECKLIST_GATE_TOKEN is the correctly-scoped
      # credential and already exists at this exact Infisical path; it is now
      # also an ORG Actions secret so every consumer resolves it from link 1 of
      # the chain without pasting a secret into any repo.
      - name: Fetch SOP_CHECKLIST_GATE_TOKEN from Infisical SSOT
        if: ${{ secrets.INFISICAL_CI_CLIENT_ID != '' }}
        env:
          INFISICAL_CI_CLIENT_ID: ${{ secrets.INFISICAL_CI_CLIENT_ID }}
          INFISICAL_CI_CLIENT_SECRET: ${{ secrets.INFISICAL_CI_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_CI_PROJECT_ID }}
        run: |
          set -uo pipefail
          BASE="https://key.moleculesai.app"
          TOK=$(curl -fsS -X POST "$BASE/api/v1/auth/universal-auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"clientId\":\"$INFISICAL_CI_CLIENT_ID\",\"clientSecret\":\"$INFISICAL_CI_CLIENT_SECRET\"}" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["accessToken"])')
          VALUE=$(curl -fsS "$BASE/api/v3/secrets/raw/SOP_CHECKLIST_GATE_TOKEN?workspaceId=$INFISICAL_PROJECT_ID&environment=prod&secretPath=%2Fshared%2Fgitea-bot-tokens" \
            -H "Authorization: Bearer $TOK" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["secret"]["secretValue"])')
          if [ -z "${VALUE}" ]; then
            echo "Infisical returned empty for SOP_CHECKLIST_GATE_TOKEN -- authoritative fetch failed" >&2
            exit 1
          fi
          echo "::add-mask::$VALUE"
          echo "INFISICAL_SOP_CHECKLIST_GATE_TOKEN=$VALUE" >> "$GITHUB_ENV"
          echo "SOP_CHECKLIST_GATE_TOKEN loaded from Infisical (non-empty, len=${#VALUE})"

      - name: Run sop-checklist-gate
        env:
          # Full precedence chain, superset of what the three vendored copies
          # carried. Resolved at RUNTIME (not via a parse-time ${{ env.* }}
          # expression) so a value written to $GITHUB_ENV by the optional step
          # above is actually visible.
          SOP_CHECKLIST_GATE_TOKEN: ${{ secrets.SOP_CHECKLIST_GATE_TOKEN }}
          SECRET_SOP_TIER_CHECK_TOKEN: ${{ secrets.SOP_TIER_CHECK_TOKEN }}
          RFC_324_TEAM_READ_TOKEN: ${{ secrets.RFC_324_TEAM_READ_TOKEN }}
          REPO_GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          # Org Actions variable. While != 'true' the gate evaluates every ack
          # in full but posts SUCCESS with the real tally appended. Set it to
          # 'true' to restore hard enforcement with zero code change.
          MERGE_REQUIRE_SOP_ACK: ${{ vars.MERGE_REQUIRE_SOP_ACK }}
          # Org Actions variable. Origin the gate CALLS for the REST API.
          # Separate from the public host used for the status link, so the API
          # can move off the Cloudflare edge without breaking that link.
          MOLECULE_GITEA_API_HOST: ${{ vars.MOLECULE_GITEA_API_HOST }}
        run: |
          set -uo pipefail
          # Precedence, most- to least-correctly-scoped. The first two links
          # are the only ones that carry `write:repository`; the tail exists so
          # a repo mid-migration still evaluates acks (the script tolerates a
          # 403 on the status POST when the gate itself passed) rather than
          # going red for a credential reason.
          GITEA_TOKEN="${SOP_CHECKLIST_GATE_TOKEN:-${INFISICAL_SOP_CHECKLIST_GATE_TOKEN:-${SECRET_SOP_TIER_CHECK_TOKEN:-${RFC_324_TEAM_READ_TOKEN:-${REPO_GITEA_TOKEN:-${GH_TOKEN:-}}}}}}"
          export GITEA_TOKEN
          if [ -z "${GITEA_TOKEN}" ]; then
            echo "no usable gate token resolved from any link in the precedence chain" >&2
            exit 1
          fi
          set -o pipefail
          python3 "$RUNNER_TEMP/molecule-ci-ssot/scripts/sop_checklist_gate.py" \
            --owner "$OWNER" \
            --repo "$REPO_NAME" \
            --pr "$PR_NUMBER" \
            --config .gitea/sop-checklist-config.yaml \
            --gitea-host git.moleculesai.app \
            | tee /tmp/sop-checklist-gate.log

      - name: Assert execution sentinel
        run: grep -qxF 'sop-checklist:sentinel:executed' /tmp/sop-checklist-gate.log

      # The gate picks a CHECKLIST TIER from the paths the diff touches, and a
      # silent downgrade is how a gate gets quietly hollowed out. So the tier
      # disclosure is a hard assertion, not a nicety: a run that decided a tier
      # without printing which one and why does not pass this step. The line
      # also lands in the job log verbatim, so a reviewer can read the reason
      # (`reserved path …`, `all N changed file(s) trivial-only`, `fail-closed:
      # …`) without re-deriving it.
      - name: Assert checklist-tier disclosure
        run: |
          grep -E '^sop-checklist:tier:(full|light):.+' /tmp/sop-checklist-gate.log
